name: LocalAIAgent

options:
  bundleIdPrefix: com.localai
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic

packages:
  llama:
    path: .

targets:
  LocalAIAgent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: LocalAIAgent
        excludes:
          - "BundledModels/*.gguf"
          - "BundledModels/README.md"

    resources:
      - path: LocalAIAgent/BundledModels
        excludes:
          - README.md

    info:
      path: LocalAIAgent/Info.plist
      properties:
        CFBundleDisplayName: Agent IA Local
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIColorName: ""
        NSMicrophoneUsageDescription: "Nécessaire pour la reconnaissance vocale — dicter vos messages à l'agent IA"
        NSSpeechRecognitionUsageDescription: "Nécessaire pour la reconnaissance vocale hors ligne"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

    dependencies:
      - package: llama
        product: llama

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localai.LocalAIAgent
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""

schemes:
  LocalAIAgent:
    build:
      targets:
        LocalAIAgent: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
    archive:
      config: Release